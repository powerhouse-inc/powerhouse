# Powerhouse stack — production images (`latest`).
#
# Channel variants (same shape, different image tag):
#   docker-compose.dev.yml      → `dev`       (main)
#   docker-compose.test.yml     → `rc`        (release candidates)
#   docker-compose.staging.yml  → `staging`   (release/staging/*)
# PGlite variant (no postgres service):
#   docker-compose.pglite.yml
#
# Usage:
#   docker compose up -d
#
# Host ports: connect 3000, switchboard 4000, postgres 5444 (127.0.0.1 only).

name: powerhouse

services:
  connect:
    image: cr.vetra.io/powerhouse-inc-powerhouse/connect:latest
    # Auto-connect the SPA to the local switchboard. The entrypoint deep-merges
    # this JSON into the dist powerhouse.config.json (operator-wins). The first
    # default drive's origin also configures the attachment service.
    environment:
      - 'PH_CONNECT_CONFIG_JSON={"connect":{"drives":{"defaultDrives":[{"url":"http://localhost:4000","name":null,"icon":null}]}}}'
    ports:
      - "127.0.0.1:3000:3001"
    networks:
      - powerhouse_network
    hostname: connect.powerhouse
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  switchboard:
    image: cr.vetra.io/powerhouse-inc-powerhouse/switchboard:latest
    environment:
      # Reactor storage + entrypoint migration gate.
      - PH_REACTOR_DATABASE_URL=postgres://postgres:postgres@postgres:5432/postgres
      # Read-model storage. Both point at the same database.
      - PH_SWITCHBOARD_DATABASE_URL=postgres://postgres:postgres@postgres:5432/postgres
    ports:
      - "127.0.0.1:4000:3000"
    networks:
      - powerhouse_network
    hostname: switchboard.powerhouse
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3

  postgres:
    image: postgres:16.1
    ports:
      - "127.0.0.1:5444:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - powerhouse_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 3

networks:
  powerhouse_network:

volumes:
  postgres_data:
