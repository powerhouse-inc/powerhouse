query FindDocuments(
  $search: SearchFilterInput
  $view: ViewFilterInput
  $paging: PagingInput
) {
  findDocuments(search: $search, view: $view, paging: $paging) {
    items {
      ...PHDocumentFields
    }
    hasNextPage
    hasPreviousPage
    cursor
  }
}

query GetDocumentOperations(
  $filter: OperationsFilterInput!
  $paging: PagingInput
) {
  documentOperations(filter: $filter, paging: $paging) {
    items {
      index
      timestampUtcMs
      hash
      skip
      error
      deniedReason
      id
      action {
        id
        type
        timestampUtcMs
        input
        scope
        context {
          signer {
            user {
              address
              networkId
              chainId
            }
            app {
              name
              key
            }
            signatures
          }
        }
      }
    }
    hasNextPage
    hasPreviousPage
    cursor
  }
}

fragment JobInfoFields on JobInfo {
  id
  documentId
  status
  result
  error
  errorName
  createdAt
  completedAt
  consistencyToken {
    version
    createdAtUtcIso
    coordinates {
      documentId
      scope
      branch
      operationIndex
    }
  }
  meta {
    batchId
    batchJobIds
  }
}

query GetJobStatus($jobId: String!) {
  jobStatus(jobId: $jobId) {
    ...JobInfoFields
  }
}

query GetDocumentServed($idOrSlug: String!, $view: ViewFilterInput) {
  documentServed(idOrSlug: $idOrSlug, view: $view)
}

query GetCreateDefaults($parentIdOrSlug: String) {
  createDefaults(parentIdOrSlug: $parentIdOrSlug) {
    signaturePolicy
    protocolVersions
  }
}

query GetCreateProtocolVersions(
  $parentIdOrSlug: String
  $documentType: String!
) {
  createDefaults(parentIdOrSlug: $parentIdOrSlug, documentType: $documentType) {
    protocolVersions
  }
}

query GetUndoRedoTargets(
  $documentIdOrSlug: String!
  $scope: String
  $branch: String
) {
  undoRedoTargets(
    documentIdOrSlug: $documentIdOrSlug
    scope: $scope
    branch: $branch
  ) {
    undoTarget
    redoTarget
  }
}

fragment DriveNodeFields on DriveNode {
  ... on DriveFileNode {
    id
    driveId
    name
    parentFolder
    documentType
  }
  ... on DriveFolderNode {
    id
    driveId
    name
    parentFolder
  }
}

query GetDriveNodes(
  $driveId: ID!
  $parentFolder: ID
  $paging: PagingInput
  $kind: DriveNodeKind
) {
  driveNodes(
    driveId: $driveId
    parentFolder: $parentFolder
    paging: $paging
    kind: $kind
  ) {
    results {
      ...DriveNodeFields
    }
    nextCursor
    hasMore
  }
}

query GetDriveNode($driveId: ID!, $id: ID!) {
  driveNode(driveId: $driveId, id: $id) {
    ...DriveNodeFields
  }
}

query GetDriveDescendants($driveId: ID!, $root: ID!) {
  driveDescendants(driveId: $driveId, root: $root) {
    ...DriveNodeFields
  }
}

query EvaluateActions(
  $documentIdOrSlug: String!
  $branch: String
  $candidates: [ActionCandidateInput!]!
) {
  evaluateActions(
    documentIdOrSlug: $documentIdOrSlug
    branch: $branch
    candidates: $candidates
  ) {
    evaluations {
      decision
      reason
    }
    allAllowed
    anyAllowed
    allDenied
    anyDenied
  }
}

# Mutation operations
mutation CreateDocument($document: JSONObject!, $parentIdOrSlug: String) {
  createDocument(document: $document, parentIdOrSlug: $parentIdOrSlug) {
    ...PHDocumentFields
  }
}

mutation CreateEmptyDocument($documentType: String!, $parentIdOrSlug: String) {
  createEmptyDocument(
    documentType: $documentType
    parentIdOrSlug: $parentIdOrSlug
  ) {
    ...PHDocumentFields
  }
}

mutation MutateDocument(
  $documentIdOrSlug: String!
  $actions: [ActionInput!]!
  $branch: String
) {
  mutateDocument: execute(
    documentIdOrSlug: $documentIdOrSlug
    actions: $actions
    branch: $branch
  ) {
    ...PHDocumentFields
  }
}

mutation MutateDocumentAsync(
  $documentIdOrSlug: String!
  $actions: [ActionInput!]!
  $branch: String
) {
  mutateDocumentAsync: executeAsync(
    documentIdOrSlug: $documentIdOrSlug
    actions: $actions
    branch: $branch
  ) {
    ...JobInfoFields
  }
}

mutation ExecuteBatch($jobs: [ExecutionJobInput!]!) {
  executeBatch(jobs: $jobs) {
    jobs {
      key
      job {
        ...JobInfoFields
      }
    }
  }
}

mutation RenameDocument(
  $documentIdOrSlug: String!
  $name: String!
  $branch: String
) {
  renameDocument(
    documentIdOrSlug: $documentIdOrSlug
    name: $name
    branch: $branch
  ) {
    ...PHDocumentFields
  }
}

mutation SetPreferredEditor(
  $documentIdOrSlug: String!
  $preferredEditor: String
  $branch: String
) {
  setPreferredEditor(
    documentIdOrSlug: $documentIdOrSlug
    preferredEditor: $preferredEditor
    branch: $branch
  ) {
    ...PHDocumentFields
  }
}

mutation AddRelationship(
  $sourceIdOrSlug: String!
  $targetIdOrSlug: String!
  $relationshipType: String!
  $metadata: JSONObject
  $branch: String
) {
  addRelationship(
    sourceIdOrSlug: $sourceIdOrSlug
    targetIdOrSlug: $targetIdOrSlug
    relationshipType: $relationshipType
    metadata: $metadata
    branch: $branch
  ) {
    ...PHDocumentFields
  }
}

mutation UpdateRelationship(
  $sourceIdOrSlug: String!
  $targetIdOrSlug: String!
  $relationshipType: String!
  $metadata: JSONObject
  $branch: String
) {
  updateRelationship(
    sourceIdOrSlug: $sourceIdOrSlug
    targetIdOrSlug: $targetIdOrSlug
    relationshipType: $relationshipType
    metadata: $metadata
    branch: $branch
  ) {
    ...PHDocumentFields
  }
}

mutation RemoveRelationship(
  $sourceIdOrSlug: String!
  $targetIdOrSlug: String!
  $relationshipType: String!
  $branch: String
) {
  removeRelationship(
    sourceIdOrSlug: $sourceIdOrSlug
    targetIdOrSlug: $targetIdOrSlug
    relationshipType: $relationshipType
    branch: $branch
  ) {
    ...PHDocumentFields
  }
}

mutation MoveRelationship(
  $sourceParentIdOrSlug: String!
  $targetParentIdOrSlug: String!
  $targetIdOrSlug: String!
  $relationshipType: String!
  $branch: String
) {
  moveRelationship(
    sourceParentIdOrSlug: $sourceParentIdOrSlug
    targetParentIdOrSlug: $targetParentIdOrSlug
    targetIdOrSlug: $targetIdOrSlug
    relationshipType: $relationshipType
    branch: $branch
  ) {
    source {
      ...PHDocumentFields
    }
    target {
      ...PHDocumentFields
    }
  }
}

mutation DeleteDocument($idOrSlug: String!, $propagate: PropagationMode) {
  deleteDocument(idOrSlug: $idOrSlug, propagate: $propagate)
}

mutation DeleteDocumentSigned(
  $idOrSlug: String!
  $propagate: PropagationMode
  $signedDelete: ActionInput!
) {
  deleteDocument(
    idOrSlug: $idOrSlug
    propagate: $propagate
    signedDelete: $signedDelete
  )
}

mutation DeleteDocuments($idsOrSlugs: [String!]!, $propagate: PropagationMode) {
  deleteDocuments(idsOrSlugs: $idsOrSlugs, propagate: $propagate)
}

# Subscription operations
subscription DocumentChanges(
  $search: SearchFilterInput
  $view: ViewFilterInput
) {
  documentChanges(search: $search, view: $view) {
    type
    documents {
      ...PHDocumentFields
    }
    context {
      parentId
      childId
    }
  }
}

subscription JobChanges($jobId: String!) {
  jobChanges(jobId: $jobId) {
    jobId
    status
    result
    error
  }
}

# Sync operations (validated here; used as inline strings in reactor/gql-req-channel.ts)
query PollSyncEnvelopes(
  $channelId: String!
  $outboxAck: Int!
  $outboxLatest: Int!
  $manifestRevision: String
  $refusals: [SyncRefusalInput!]
) {
  pollSyncEnvelopes(
    channelId: $channelId
    outboxAck: $outboxAck
    outboxLatest: $outboxLatest
    manifestRevision: $manifestRevision
    refusals: $refusals
  ) {
    envelopes {
      type
      channelMeta {
        id
      }
      operations {
        operation {
          index
          timestampUtcMs
          hash
          skip
          error
          deniedReason
          id
          action {
            id
            type
            timestampUtcMs
            input
            scope
            context {
              signer {
                user {
                  address
                  networkId
                  chainId
                }
                app {
                  name
                  key
                }
                signatures
              }
            }
          }
        }
        context {
          documentId
          documentType
          scope
          branch
        }
      }
      cursor {
        remoteName
        cursorOrdinal
        lastSyncedAtUtcMs
      }
      key
      dependsOn
    }
    ackOrdinal
    deadLetters {
      documentId
      error
      errorType
    }
    hasMore
    manifestRevision
    peerManifestRevision
  }
}

mutation TouchChannel($input: TouchChannelInput!) {
  touchChannel(input: $input) {
    success
    ackOrdinal
    manifest
  }
}

mutation PushSyncEnvelopes(
  $envelopes: [SyncEnvelopeInput!]!
  $peerManifestRevision: String
) {
  pushSyncEnvelopes(
    envelopes: $envelopes
    peerManifestRevision: $peerManifestRevision
  )
}
