# Fragment for common PHDocument fields
fragment PHDocumentFields on PHDocument {
  id
  slug
  name
  documentType
  meta
  protocolVersions
  state
  revisionsList {
    scope
    revision
  }
  createdAtUtcIso
  lastModifiedAtUtcIso
}

# Fragment for the fields of a relationship edge
fragment DocumentRelationshipFields on DocumentRelationship {
  sourceId
  targetId
  relationshipType
  metadata
  createdAt
  updatedAt
}

# Query operations
query GetDocumentModels($namespace: String, $paging: PagingInput) {
  documentModels(namespace: $namespace, paging: $paging) {
    items {
      id
      name
      namespace
      version
      specification
    }
    hasNextPage
    hasPreviousPage
    cursor
  }
}

query GetDocument($idOrSlug: String!, $view: ViewFilterInput) {
  document(idOrSlug: $idOrSlug, view: $view) {
    document {
      ...PHDocumentFields
    }
    childIds
  }
}

query GetDocumentWithOperations(
  $idOrSlug: String!
  $view: ViewFilterInput
  $operationsFilter: DocumentOperationsFilterInput
  $operationsPaging: PagingInput
) {
  document(idOrSlug: $idOrSlug, view: $view) {
    document {
      ...PHDocumentFields
      operations(filter: $operationsFilter, paging: $operationsPaging) {
        items {
          index
          timestampUtcMs
          hash
          skip
          error
          deniedReason
          id
          action {
            id
            type
            timestampUtcMs
            input
            scope
            context {
              signer {
                user {
                  address
                  networkId
                  chainId
                }
                app {
                  name
                  key
                }
                signatures
              }
            }
          }
        }
        hasNextPage
        hasPreviousPage
        cursor
      }
    }
    childIds
  }
}

