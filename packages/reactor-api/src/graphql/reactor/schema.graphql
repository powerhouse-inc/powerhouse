# Scalar types (for codegen - also defined in create-schema.ts)
scalar JSONObject
scalar DateTime

# Input types
input PagingInput {
  limit: Int
  offset: Int
  cursor: String
}

input ViewFilterInput {
  branch: String
  scopes: [String!]
}

input SearchFilterInput {
  type: String
  parentId: String
  identifiers: [String!]
}

input OperationsFilterInput {
  documentId: String!
  branch: String
  scopes: [String!]
  actionTypes: [String!]
  sinceRevision: Int
  timestampFrom: String
  timestampTo: String
}

input DocumentOperationsFilterInput {
  branch: String
  scopes: [String!]
  actionTypes: [String!]
  sinceRevision: Int
  timestampFrom: String
  timestampTo: String
}

# Enums
enum PropagationMode {
  CASCADE
  ORPHAN
}

enum DocumentChangeType {
  CREATED
  DELETED
  UPDATED
  PARENT_ADDED
  PARENT_REMOVED
  CHILD_ADDED
  CHILD_REMOVED
}

# Object types
type DocumentModelGlobalState {
  id: String!
  name: String!
  namespace: String
  version: String
  specification: JSONObject!
}

type DocumentModelResultPage {
  items: [DocumentModelGlobalState!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  cursor: String
}

type Revision {
  scope: String!
  revision: Int!
}

type PHDocument {
  id: String!
  slug: String
  preferredEditor: String
  name: String!
  documentType: String!
  state: JSONObject!
  revisionsList: [Revision!]!
  createdAtUtcIso: DateTime!
  lastModifiedAtUtcIso: DateTime!
  operations(
    filter: DocumentOperationsFilterInput
    paging: PagingInput
  ): ReactorOperationResultPage
}

type PHDocumentResultPage {
  items: [PHDocument!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  cursor: String
}

type ReactorOperationResultPage {
  items: [ReactorOperation!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  cursor: String
}

type DeadLetterInfo {
  documentId: String!
  error: String!
  """
  How the origin classified the failure. A peer needs this to mirror the origin's
  quarantine decision; without it a held auth operation would freeze the document
  on the peer side while the origin kept syncing.
  """
  errorType: String
  jobId: String!
  branch: String!
  scopes: [String!]!
  operationCount: Int!
}

type PollSyncEnvelopesResult {
  envelopes: [SyncEnvelope!]!
  ackOrdinal: Int!
  deadLetters: [DeadLetterInfo!]!
  hasMore: Boolean!
}

type DocumentWithChildren {
  document: PHDocument!
  childIds: [String!]!
}

type MoveRelationshipResult {
  source: PHDocument!
  target: PHDocument!
}

type JobInfo {
  id: String!
  status: String!

  """
  What the job produced, once it has produced anything. Null until then, which
  is the state every job is in when it is handed back from a submission.
  """
  result: JSONObject

  error: String
  createdAt: DateTime!
  completedAt: DateTime
}

type DocumentChangeEvent {
  type: DocumentChangeType!
  documents: [PHDocument!]!
  context: DocumentChangeContext
}

type DocumentChangeContext {
  parentId: String
  childId: String
}

type JobChangeEvent {
  jobId: String!
  status: String!
  result: JSONObject!
  error: String
}

type ReactorSignerUser {
  address: String!
  networkId: String!
  chainId: Int!
}

type ReactorSignerApp {
  name: String!
  key: String!
}

type ReactorSigner {
  user: ReactorSignerUser
  app: ReactorSignerApp
  signatures: [String!]!
}

type ActionContext {
  signer: ReactorSigner
}

type Action {
  id: String!
  type: String!
  timestampUtcMs: String!
  input: JSONObject!
  scope: String!
  context: ActionContext
}

"""
One operation an authorization preflight predicts a verdict for.

`input` is what a conditional grant reads, so a candidate standing for a
filled-in form carries that form's input. Omitting it predicts the verdict an
empty input earns, not the verdict the filled-in form will get.
"""
input ActionCandidateInput {
  scope: String!
  type: String!
  input: JSONObject
}

enum AuthDecision {
  ALLOW
  DENY
}

"""
One candidate's predicted verdict. `reason` carries the refusal a DENY is
recorded with, and is null on an ALLOW.
"""
type ActionEvaluation {
  decision: AuthDecision!
  reason: String
}

"""
The predicted verdicts for a set of candidates, in the order they were given,
with the aggregates a caller branches on.

The aggregates are redundant -- a verdict is binary -- and all four are returned
so a caller reads the one its question is phrased in rather than negating
another. Over no candidates every aggregate is false: nothing is allowed and
nothing is denied.
"""
type ActionEvaluations {
  evaluations: [ActionEvaluation!]!
  allAllowed: Boolean!
  anyAllowed: Boolean!
  allDenied: Boolean!
  anyDenied: Boolean!
}

# Input types for sync operations
"""
An action's context, as a caller submits it.

Declares every field `ActionContext` carries, because an input object rejects a
field it does not declare: an action stamped with the head it applies to - which
is what a signing client sends - is refused outright if these are missing, and
that refusal is a whole-request one, not a per-field one.

`prevOpHash` and `prevOpIndex` are the scope head the action was composed
against. They are recorded rather than enforced; a signature is verified from
the params carried in its own tuple, which do not include them.
"""
input ActionContextInput {
  """The index of the last operation in the scope the action applies to."""
  prevOpIndex: Int

  """The hash of the state the action applies to."""
  prevOpHash: String

  """Covers replay of an operation that would otherwise be a no-op."""
  nonce: String

  signer: ReactorSignerInput
}

input ReactorSignerInput {
  user: ReactorSignerUserInput
  app: ReactorSignerAppInput
  signatures: [String!]!
}

input ReactorSignerUserInput {
  address: String!
  networkId: String!
  chainId: Int!
}

input ReactorSignerAppInput {
  name: String!
  key: String!
}

input ActionInput {
  id: String!
  type: String!
  timestampUtcMs: String!
  input: JSONObject!
  scope: String!
  context: ActionContextInput
}

# Synchronization types
type ReactorOperation {
  index: Int!
  timestampUtcMs: String!
  hash: String!
  skip: Int!
  error: String
  deniedReason: String
  id: String
  action: Action!
}

input OperationInput {
  index: Int!
  timestampUtcMs: String!
  hash: String!
  skip: Int!
  error: String
  deniedReason: String
  id: String
  action: ActionInput!
}

type OperationContext {
  documentId: String!
  documentType: String!
  scope: String!
  branch: String!
  ordinal: Int!
}

input OperationContextInput {
  documentId: String!
  documentType: String!
  scope: String!
  branch: String!
  ordinal: Int!
}

type OperationWithContext {
  operation: ReactorOperation!
  context: OperationContext!
}

input OperationWithContextInput {
  operation: OperationInput!
  context: OperationContextInput!
}

type ChannelMeta {
  id: String!
}

input ChannelMetaInput {
  id: String!
}

type RemoteCursor {
  remoteName: String!
  cursorOrdinal: Int!
  lastSyncedAtUtcMs: String
}

input RemoteCursorInput {
  remoteName: String!
  cursorOrdinal: Int!
  lastSyncedAtUtcMs: String
}

enum SyncEnvelopeType {
  OPERATIONS
  ACK
}

type SyncEnvelope {
  type: SyncEnvelopeType!
  channelMeta: ChannelMeta!
  operations: [OperationWithContext!]
  cursor: RemoteCursor
  key: String
  dependsOn: [String!]
}

input SyncEnvelopeInput {
  type: SyncEnvelopeType!
  channelMeta: ChannelMetaInput!
  operations: [OperationWithContextInput!]
  cursor: RemoteCursorInput
  key: String
  dependsOn: [String!]
}

input RemoteFilterInput {
  documentId: [String!]!
  scope: [String!]!
  branch: String!
}

input TouchChannelInput {
  id: String!
  name: String!
  collectionId: String!
  filter: RemoteFilterInput!
  sinceTimestampUtcMs: String!
}

type TouchChannelResult {
  success: Boolean!
  ackOrdinal: Int!
}

type Query {
  # Get document models for a namespace
  documentModels(
    namespace: String
    paging: PagingInput
  ): DocumentModelResultPage!

  # Get a specific document by ID or slug
  document(identifier: String!, view: ViewFilterInput): DocumentWithChildren

  # Get outgoing relationships of a given type from a source document
  documentOutgoingRelationships(
    sourceIdentifier: String!
    relationshipType: String!
    view: ViewFilterInput
    paging: PagingInput
  ): PHDocumentResultPage!

  # Get incoming relationships of a given type to a target document
  documentIncomingRelationships(
    targetIdentifier: String!
    relationshipType: String!
    view: ViewFilterInput
    paging: PagingInput
  ): PHDocumentResultPage!

  # Find documents by search criteria
  findDocuments(
    search: SearchFilterInput
    view: ViewFilterInput
    paging: PagingInput
  ): PHDocumentResultPage!

  # Get job status
  jobStatus(jobId: String!): JobInfo

  # Get operations for a document with filtering and pagination
  documentOperations(
    filter: OperationsFilterInput!
    paging: PagingInput
  ): ReactorOperationResultPage!

  """
  Predicts whether the calling subject would be admitted to execute each of a
  set of candidate operations, without submitting any of them. A UI asks this to
  disable a control rather than offer an action that fails on submit.

  The answer is a prediction, not a promise:

  - Real admission compiles an append condition over everything it read and the
    store enforces it at write time. A preflight reads no future, so a policy
    change landing between this answer and the submit changes the verdict. The
    submit path stays the only authority.
  - The verdict is evaluated at the stream heads, so it is correct for a
    candidate about to be submitted. A backdated submission is out of contract;
    the reactor decides that one by position.
  - A candidate whose verdict depends on its input has to carry that input, since
    a conditional grant reads it.

  The subject is the authenticated caller and cannot be named in the request:
  answering for an arbitrary subject would disclose what a policy grants
  somebody else. It carries both the caller's address and the did:key of the app
  instance whose token authenticated the request, so a policy naming either
  matches the same principal the write path presents.

  Requires the reactor's authEnforcement feature flag. Without it the reactor
  holds no decision model, so this fails with extensions.code
  AUTH_EVALUATION_UNSUPPORTED rather than guessing.
  """
  evaluateActions(
    documentIdentifier: String!
    branch: String
    candidates: [ActionCandidateInput!]!
  ): ActionEvaluations!

  """
  Polls for sync envelopes from a channel.

  An operation stored before the API required an action id cannot be
  represented by this schema, and rather than serving a partial response beside
  a bare non-null violation, this fails with extensions.code
  MALFORMED_STORED_OPERATION naming the operation. That code means the failure
  is worth polling through: the document holding the operation needs repairing,
  but the channel serves every other document, and a peer that stopped polling
  would stop receiving those too.
  """
  pollSyncEnvelopes(
    channelId: String!
    outboxAck: Int!
    outboxLatest: Int!
  ): PollSyncEnvelopesResult!
}

type Mutation {
  # Create a new document
  createDocument(document: JSONObject!, parentIdentifier: String): PHDocument!

  # Create an empty document of specified type
  createEmptyDocument(
    documentType: String!
    parentIdentifier: String
  ): PHDocument!

  # Apply actions to a document (synchronous)
  mutateDocument(
    documentIdentifier: String!
    actions: [JSONObject!]!
    view: ViewFilterInput
  ): PHDocument!

  # Submit actions to a document (asynchronous)
  mutateDocumentAsync(
    documentIdentifier: String!
    actions: [JSONObject!]!
    view: ViewFilterInput
  ): String!

  # Rename a document
  renameDocument(
    documentIdentifier: String!
    name: String!
    branch: String
  ): PHDocument!

  # Update the preferred editor recorded in the document header meta.
  # Pass null/omit to clear it.
  setPreferredEditor(
    documentIdentifier: String!
    preferredEditor: String
    branch: String
  ): PHDocument!

  # Add a relationship between two documents
  addRelationship(
    sourceIdentifier: String!
    targetIdentifier: String!
    relationshipType: String!
    branch: String
  ): PHDocument!

  # Remove a relationship between two documents
  removeRelationship(
    sourceIdentifier: String!
    targetIdentifier: String!
    relationshipType: String!
    branch: String
  ): PHDocument!

  # Move a relationship from one source to another
  moveRelationship(
    sourceParentIdentifier: String!
    targetParentIdentifier: String!
    targetIdentifier: String!
    relationshipType: String!
    branch: String
  ): MoveRelationshipResult!

  # Delete a single document
  deleteDocument(identifier: String!, propagate: PropagationMode): Boolean!

  # Delete multiple documents
  deleteDocuments(identifiers: [String!]!, propagate: PropagationMode): Boolean!

  # Touch (create or update) a channel for sync
  touchChannel(input: TouchChannelInput!): TouchChannelResult!

  # Push sync envelopes to a channel
  pushSyncEnvelopes(envelopes: [SyncEnvelopeInput!]!): Boolean!
}

type Subscription {
  # Subscribe to document changes
  documentChanges(
    search: SearchFilterInput
    view: ViewFilterInput
  ): DocumentChangeEvent!

  # Subscribe to job changes
  jobChanges(jobId: String!): JobChangeEvent!
}
