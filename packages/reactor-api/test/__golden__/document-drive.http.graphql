  """Find DocumentDrive documents by search criteria"""
  findDocuments(paging: DocumentDrive_PagingInput, search: DocumentDrive_SearchFilterInput, view: DocumentDrive_ViewFilterInput): DocumentDrive_DocumentResultPage!
}

