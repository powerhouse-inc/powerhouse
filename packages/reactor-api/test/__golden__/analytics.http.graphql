directive @extends on INTERFACE | OBJECT

directive @external on FIELD_DEFINITION

directive @key(fields: _FieldSet!) on INTERFACE | OBJECT

directive @provides(fields: _FieldSet!) on FIELD_DEFINITION

directive @requires(fields: _FieldSet!) on FIELD_DEFINITION

directive @tag(name: String!) on ARGUMENT_DEFINITION | ENUM | ENUM_VALUE | FIELD_DEFINITION | INPUT_FIELD_DEFINITION | INPUT_OBJECT | INTERFACE | OBJECT | SCALAR | UNION

scalar Address

scalar Amount

scalar Amount_Crypto

scalar Amount_Currency

scalar Amount_Fiat

scalar Amount_Money

scalar Amount_Percentage

scalar Amount_Tokens

input AnalyticsFilter {
  currency: String

  """List of dimensions to filter by, such as 'budget' or 'project'"""
  dimensions: [AnalyticsFilterDimension]
  end: String

  """Period to group by"""
  granularity: AnalyticsGranularity

  """List of metrics to filter by, such as 'budget' or 'actuals'"""
  metrics: [String]
  start: String
}

input AnalyticsFilterDimension {
  lod: Int!
  name: String!
  select: String!
}

enum AnalyticsGranularity {
  annual
  daily
  hourly
  monthly
  quarterly
  semiAnnual
  total
  weekly
}

type AnalyticsPeriod {
  end: DateTime
  period: String
  rows: [AnalyticsSeries]
  start: DateTime
}

type AnalyticsQuery {
  currencies: [String]
  dimensions: [Dimension]
  metrics: [String]
  multiCurrencySeries(filter: MultiCurrencyConversions): [AnalyticsPeriod]
  series(filter: AnalyticsFilter): [AnalyticsPeriod]
}

type AnalyticsSeries {
  dimensions: [AnalyticsSeriesDimension]
  metric: String
  sum: Float
  unit: String
  value: Float
}

type AnalyticsSeriesDimension {
  description: String
  icon: String
  label: String
  name: String
  path: String
}

scalar AttachmentRef

scalar Currency

input CurrencyConversion {
  metric: String!
  sourceCurrency: String!
}

scalar Date

scalar DateTime

type Dimension {
  name: String
  values: [Value]
}

type DocumentDrive implements IDocument {
  createdAtUtcIso: DateTime!
  documentType: String!
  id: String!
  initialState: DocumentDrive_DocumentDriveState!
  lastModifiedAtUtcIso: DateTime!
  name: String!
  operations(first: Int, skip: Int): [Operation!]!
  revision: Int!
  state: DocumentDrive_DocumentDriveState!
  stateJSON: JSONObject
}

type DocumentDrive_DocumentDriveLocalState {
  availableOffline: Boolean!
  listeners: [DocumentDrive_Listener!]!
  sharingType: String
  triggers: [DocumentDrive_Trigger!]!
}

type DocumentDrive_DocumentDriveState {
  icon: String
  name: String!
  nodes: [DocumentDrive_Node!]!
}

type DocumentDrive_FileNode {
  documentType: String!
  id: String!
  kind: String!
  name: String!
  parentFolder: String
}

type DocumentDrive_FolderNode {
  id: String!
  kind: String!
  name: String!
  parentFolder: String
}

type DocumentDrive_Listener {
  block: Boolean!
  callInfo: DocumentDrive_ListenerCallInfo
  filter: DocumentDrive_ListenerFilter!
  label: String
  listenerId: ID!
  system: Boolean!
}

type DocumentDrive_ListenerCallInfo {
  data: String
  name: String
  transmitterType: DocumentDrive_TransmitterType
}

type DocumentDrive_ListenerFilter {
  branch: [String!]
  documentId: [ID!]
  documentType: [String!]!
  scope: [String!]
}

union DocumentDrive_Node = DocumentDrive_FileNode | DocumentDrive_FolderNode

type DocumentDrive_PullResponderTriggerData {
  interval: String!
  listenerId: ID!
  url: String!
}

enum DocumentDrive_TransmitterType {
  Internal
  MatrixConnect
  PullResponder
  RESTWebhook
  SecureConnect
  SwitchboardPush
}

type DocumentDrive_Trigger {
  data: DocumentDrive_TriggerData
  id: ID!
  type: DocumentDrive_TriggerType!
}

union DocumentDrive_TriggerData = DocumentDrive_PullResponderTriggerData

enum DocumentDrive_TriggerType {
  PullResponder
}

type DocumentModel implements IDocument {
  createdAtUtcIso: DateTime!
  documentType: String!
  id: String!
  lastModifiedAtUtcIso: DateTime!
