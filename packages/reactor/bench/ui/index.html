<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bench records</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light; font: 14px/1.45 system-ui, -apple-system, sans-serif; }
  body { margin: 0; color: #1f2937; background: #fff; }
  #app { max-width: 1400px; margin: 0 auto; padding: 0 16px 48px; }
  header { display: flex; gap: 16px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid #e5e7eb; margin-bottom: 16px; }
  header .brand { font-weight: 700; font-size: 16px; color: inherit; text-decoration: none; }
  header button { margin-left: auto; }
  h2 { font-size: 18px; margin: 24px 0 8px; }
  h3 { font-size: 15px; margin: 18px 0 6px; }
  h4 { font-size: 14px; margin: 14px 0 4px; color: #374151; }
  a { color: #1d4ed8; }
  a.id, a.sha, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .muted { color: #6b7280; }
  .title { font-size: 16px; }
  table { border-collapse: collapse; width: 100%; margin: 6px 0 12px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
  th { color: #6b7280; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .02em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.kv th { text-transform: none; width: 120px; }
  table.history td.note { white-space: pre-wrap; max-width: 60ch; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; color: #fff; font-size: 11px; font-weight: 600; vertical-align: middle; }
  .badge.kind.DEFECT { background: #7c3aed; } .badge.kind.HARNESS { background: #b45309; } .badge.kind.GAP { background: #0f766e; }
  .badge.lint { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
  .badge.invalid { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  .badge.fixes { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
  .badge.touches { background: #e0e7ff; color: #3730a3; border: 1px solid #a5b4fc; }
  ol.commits li.fixes { background: #f0fdf4; } ol.commits li.touches { background: #eef2ff; }
  details.files { display: inline-block; margin-left: 6px; font-size: 12px; } details.files ul { margin: 2px 0 6px; }
  .banner { padding: 8px 12px; border-radius: 6px; margin: 8px 0; }
  .banner.warn { background: #fffbeb; border: 1px solid #fcd34d; color: #78350f; }
  .banner.invalid { background: #fef2f2; border: 1px solid #fca5a5; color: #7f1d1d; }
  .banner ul { margin: 4px 0 0; }
  .controls { display: flex; gap: 18px; align-items: center; margin: 8px 0; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 14px; margin: 10px 0; }
  .card h3 { margin-top: 0; }
  details.gap { margin: 6px 0; } details.gap summary { cursor: pointer; }
  ol.commits { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  details.raw pre { background: #f9fafb; border: 1px solid #e5e7eb; padding: 10px; overflow: auto; max-height: 60vh; font-size: 12px; }
  #charts h3 { margin-top: 20px; }
  figure { margin: 0; }
</style>
</head>
<body>
<div id="app"><p class="muted" style="padding:16px">loading…</p></div>
<script type="module" src="./app.js"></script>
</body>
</html>
