scalar DateTime
scalar Address
scalar Unknown
scalar AttachmentRef

directive @equals(
  value: String = ""
) on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

interface IAction {
  type: String!
}

type Action implements IAction {
  type: String!
}

interface IOperation {
  type: String!
  index: Int!
  timestamp: DateTime!
  hash: String!
}

type Operation implements IOperation {
  type: String!
  index: Int!
  timestamp: DateTime!
  hash: String!
}

interface IDocument {
  name: String!
  documentType: String!
  revision: Int!
  created: DateTime!
  lastModified: DateTime!
  operations: [IOperation!]!
}

type Query {
  document: IDocument
}

enum SET_NAME {
  SET_NAME
}

input SetNameActionInput {
  name: String!
}

type SetNameOperation implements IOperation {
  type: String!
  input: SetNameActionInput!
  index: Int!
  timestamp: DateTime!
  hash: String!
}

input SetNameAction {
  type: SET_NAME!
  input: SetNameActionInput!
}

enum SET_PREFERRED_EDITOR {
  SET_PREFERRED_EDITOR
}

input SetPreferredEditorActionInput {
  preferredEditor: String
}

type SetPreferredEditorOperation implements IOperation {
  type: String!
  input: SetPreferredEditorActionInput!
  index: Int!
  timestamp: DateTime!
  hash: String!
}

input SetPreferredEditorAction {
  type: SET_PREFERRED_EDITOR!
  input: SetPreferredEditorActionInput!
}

enum SET_SLUG {
  SET_SLUG
}

input SetSlugActionInput {
  slug: String!
}

type SetSlugOperation implements IOperation {
  type: String!
  input: SetSlugActionInput!
  index: Int!
  timestamp: DateTime!
  hash: String!
}

input SetSlugAction {
  type: SET_SLUG!
  input: SetSlugActionInput!
}

enum UNDO {
  UNDO
}

input UndoActionInput {
  count: Int!
}

input UndoAction {
  type: UNDO!
  input: UndoActionInput!
}

enum REDO {
  REDO
}

input RedoActionInput {
  count: Int!
}

input RedoAction {
  type: REDO!
  input: RedoActionInput!
}

union DocumentAction =
  | SetNameAction
  | SetPreferredEditorAction
  | SetSlugAction
  | UndoAction
  | RedoAction

type Mutation {
  setName(input: SetNameAction!): IDocument
  setPreferredEditor(input: SetPreferredEditorAction!): IDocument
  setSlug(input: SetSlugAction!): IDocument
  undo(input: UndoAction!): IDocument
  redo(input: RedoAction!): IDocument
}
