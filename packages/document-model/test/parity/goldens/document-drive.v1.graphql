type FolderNode {
    id: String!
    name: String!
    kind: String!
    parentFolder: String
}

type FileNode {
    id: String!
    name: String!
    kind: String!
    documentType: String!
    parentFolder: String
}

union Node = FolderNode | FileNode

type DocumentDriveState {
    name: String!
    nodes: [Node!]! @deprecated(reason: "Use the reactor-drive subgraph (`reactorDrive.rootNodes`, `ReactorDriveFolderNode.children`) for paged listings.")
    icon: String
}

type ListenerFilter {
    documentType: [String!]
    documentId: [ID!]
    scope: [String!]
    branch: [String!]
}

enum TransmitterType {
    Internal,
    SwitchboardPush,
    PullResponder,
    SecureConnect, 
    MatrixConnect,
    RESTWebhook
}

type ListenerCallInfo {
    transmitterType: TransmitterType
    name: String
    data: String
}

type Listener {
    listenerId: ID!
    label: String
    block: Boolean!
    system: Boolean!
    filter: ListenerFilter!
    callInfo: ListenerCallInfo
}

enum TriggerType {
    PullResponder
}

type PullResponderTriggerData {
    listenerId: ID!
    url: String!
    interval: String!
}

union TriggerData = PullResponderTriggerData

type Trigger {
    id: ID!
    type: TriggerType!
    data: TriggerData
}

type DocumentDriveLocalState{
    sharingType: String
    listeners: [Listener!]!
    triggers: [Trigger!]!
    availableOffline: Boolean!
}

# Node

input AddFileInput {
    id: ID!
    name: String!
    documentType: String!
    parentFolder: ID
}

input AddFolderInput {
    id: ID!
    name: String!
    parentFolder: ID
}

input DeleteNodeInput {
    id: ID!
}

input UpdateFileInput {
    id: ID!
    parentFolder: ID
    name: String
    documentType: String
}

input UpdateNodeInput {
    id: ID!
    parentFolder: ID
    name: String
}

input CopyNodeInput {
    srcId: ID!
    targetId: ID!
    targetName: String
    targetParentFolder: ID
}

input MoveNodeInput {
    srcFolder: ID!
    targetParentFolder: ID
}

# Drive

input SetDriveNameInput {
    name: String!
}

input SetDriveIconInput {
    icon: String
}

input SetSharingTypeInput {
    type: String!
}

input SetAvailableOfflineInput {
    availableOffline: Boolean!
}

input ListenerFilterInput {
    documentType: [String!]
    documentId: [ID!]
    scope: [String!]
    branch: [String!]
}

input ListenerCallInfoInput {
    transmitterType: TransmitterType
    name: String
    data: String
}

input ListenerInput {
    listenerId: ID!
    label: String
    block: Boolean!
    system: Boolean!
    filter: ListenerFilterInput!
    callInfo: ListenerCallInfoInput
}

input AddListenerInput {
    listener: ListenerInput!
}

input RemoveListenerInput {
    listenerId: String!
}

input PullResponderTriggerDataInput {
    listenerId: ID!
    url: String!
    interval: String!
}

input TriggerInput {
    id: ID!
    type: TriggerType!
    data: PullResponderTriggerDataInput
}

input AddTriggerInput {
    trigger: TriggerInput!
}

input RemoveTriggerInput {
    triggerId: String!
}
