type TodoState {
  title: String
  todos: [TodoItem!]!
}

type TodoItem {
  id: String!
  title: String!
  completed: Boolean!
}

input AddTodoInput {
  id: String!
  title: String!
  completed: Boolean!
}

input RemoveTodoInput {
  id: String!
}

input UpdateTodoInput {
  id: String!
  title: String
  completed: Boolean
}

input EditTitleInput {
  title: String
}
