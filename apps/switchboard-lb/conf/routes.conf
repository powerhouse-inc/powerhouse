server {
    listen 8080;

    access_log /usr/local/openresty/nginx/logs/access.log lb_kv;

    # Route class: Subscription — WebSocket upgrade.
    # Exact match wins over the /graphql prefix below.
    location = /graphql/subscriptions {
        set $route_class "subscription";
        proxy_pass          http://switchboards;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
        proxy_next_upstream off;

        proxy_intercept_errors on;
        error_page 502 504 = @no_backend;
    }

    # Route class: Document-scoped — supergraph, reactor subgraph,
    # per-model subgraphs, /graphql/stream, /graphql/<name>/stream.
    # rewrite_by_lua reads the `Drive-Id` request header into $doc_id;
    # upstream picks the backend via hash $doc_id consistent. Empty
    # header → empty key → round-robin fallback. Switchboards validate
    # drive ownership and return a wrong-shard error on misroute.
    location /graphql {
        set $route_class "graphql";
        rewrite_by_lua_block { require("route").from_header() }
        proxy_pass          http://switchboards;
        proxy_http_version  1.1;
        proxy_set_header    Connection "";
        proxy_next_upstream off;

        # Dev-only debug aid: surface the chosen backend so the lb-loadtest
        # harness can assert pinning programmatically. `always` so the header
        # is set on 4xx/5xx too. `$upstream_addr` is empty on @no_backend
        # paths — the harness ignores 503s anyway.
        add_header X-LB-Upstream $upstream_addr always;

        proxy_intercept_errors on;
        error_page 502 504 = @no_backend;
    }

    # Route class: Drive metadata (REST). Any healthy backend is correct.
    location ~ ^/d/[^/]+$ {
        set $route_class "drive";
        proxy_pass          http://switchboards;
        proxy_http_version  1.1;
        proxy_set_header    Connection "";
        proxy_next_upstream off;

        add_header X-LB-Upstream $upstream_addr always;

        proxy_intercept_errors on;
        error_page 502 504 = @no_backend;
    }

    # Route class: Webhook — token-addressed inbound deliveries from third
    # parties. Stateless: any backend can serve any delivery, because dedupe
    # is a database claim rather than instance state. Keyed on the token so
    # one endpoint's redeliveries pin to one backend (warm dedupe row, and a
    # per-process rate limiter that means what it says) while distinct
    # endpoints spread across the pool.
    #
    # A prefix match, not a regex on the token shape: the upstream answers an
    # unknown and a malformed token identically, and a location that only
    # matched well-formed tokens would let malformed ones fall through to
    # nginx's own 404 — telling a prober the difference.
    location /webhooks {
        set $route_class "webhook";
        rewrite_by_lua_block { require("route").from_webhook_token() }
        proxy_pass          http://switchboards;
        proxy_http_version  1.1;
        proxy_set_header    Connection "";
        proxy_next_upstream off;

        # The origin enforces the real per-endpoint cap (and answers 413 with
        # a JSON body); this only has to be loose enough not to pre-empt it.
        client_max_body_size 10m;

        add_header X-LB-Upstream $upstream_addr always;

        proxy_intercept_errors on;
        error_page 502 504 = @no_backend;
    }

    # Route class: Package REST — routes a loaded package serves under its own
    # namespace, e.g. /api/@scope/pkg/runs/42. Pins on `Drive-Id` when the
    # caller sends one, spreads per-request when it does not; see
    # lua/route.lua for why the fallback is not an empty key.
    location /api {
        set $route_class "api";
        rewrite_by_lua_block { require("route").spread() }
        proxy_pass          http://switchboards;
        proxy_http_version  1.1;
        proxy_set_header    Connection "";
        proxy_next_upstream off;

        client_max_body_size 10m;

        add_header X-LB-Upstream $upstream_addr always;

        proxy_intercept_errors on;
        error_page 502 504 = @no_backend;
    }

    # Route class: Global — served locally, no upstream.
    location = /health {
        set $route_class "health";
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Translate "no live upstream" / upstream timeout into 503 per §4.5.
    # nginx defaults to 502 when the only ring slot is marked down by the
    # healthcheck, but the LB's contract with clients is 503 ("backend
    # unavailable, retry later"). The underlying nginx status survives in
    # the access log as $upstream_status — log inspection tells the cause,
    # the wire response just says "unavailable".
    # $route_class is inherited from the original location so metrics
    # attribute the 503 to e.g. class=graphql, not class=unknown.
    location @no_backend {
        internal;
        default_type application/json;
        return 503 '{"error":"backend unavailable for this request"}';
    }

    # Server-level log phase: emit Prometheus metrics for every request.
    # Fires after the response is delivered (no client-facing latency
    # impact) and reads $route_class / $upstream_addr / $status /
    # $upstream_response_time. One declaration covers every location,
    # including the @no_backend internal redirect (which reuses the
    # original request's log phase — no double counting). See lua/metrics.lua.
    log_by_lua_block {
        require("metrics").record_request()
    }
}
