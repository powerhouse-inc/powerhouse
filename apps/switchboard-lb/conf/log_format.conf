# A webhook's token is the whole credential, and it sits in the path. Logging
# it verbatim copies that secret into log storage, so the path is redacted.
# The segment can sit at any depth: the family mounts under the host's base
# path, and route.lua keys off the last segment for the same reason.
map $uri $uri_logged {
    default               $uri;
    "~^(.*)/webhooks/.+$" "$1/webhooks/[redacted]";
}

log_format lb_kv escape=json
    'time=$time_iso8601 '
    'remote_addr=$remote_addr '
    'method=$request_method '
    'uri=$uri_logged '
    'status=$status '
    'request_time=$request_time '
    'upstream_addr=$upstream_addr '
    'upstream_response_time=$upstream_response_time '
    'doc_id=$doc_id '
    'request_id=$request_id';
