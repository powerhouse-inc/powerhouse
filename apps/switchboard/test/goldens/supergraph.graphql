    targetParentIdentifier: String
      @deprecated(reason: "Use targetParentIdOrSlug.")
    targetIdOrSlug: String
    targetIdentifier: String @deprecated(reason: "Use targetIdOrSlug.")
    relationshipType: String!
    branch: String
  ): MoveRelationshipResult!
  deleteDocument(
    idOrSlug: String
    identifier: String @deprecated(reason: "Use idOrSlug.")
    propagate: PropagationMode
  ): Boolean!
  deleteDocuments(
    idsOrSlugs: [String!]
    identifiers: [String!] @deprecated(reason: "Use idsOrSlugs.")
