  """
  Bumped on every draft edit; REVERT_TO_PUBLISHED resets it to published.version. A run records the version it executed.
  """
  version: Int!
  trigger: Workflow_TriggerBinding
  steps: [Workflow_WorkflowStep!]!
  edges: [Workflow_WorkflowEdge!]!
  variables: [Workflow_WorkflowVariable!]!
  policy: Workflow_WorkflowPolicy!
  """
  Last published snapshot; version !== published.version means unpublished changes.
  """
  published: Workflow_PublishedWorkflow
  """
  Who keeps this workflow as it is, e.g. an app's integration; null: people edit it. Editors show a managed workflow read-only.
  """
  managedBy: Workflow_WorkflowManager
  """
  Denormalised for inspectors; written by the runtime.
  """
  lastRunAt: DateTime
  lastRunStatus: Workflow_RunStatus
}

