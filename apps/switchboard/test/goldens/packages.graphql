type Connection implements IDocument {
  id: String!
  name: String!
  documentType: String!
  operations(skip: Int, first: Int): [Operation!]!
  revision: Int!
  createdAtUtcIso: DateTime!
  lastModifiedAtUtcIso: DateTime!
  initialState: Connection_ConnectionState!
  state: Connection_ConnectionState!
  stateJSON: JSONObject
}

enum Connection_ConnectionAuthType {
  SECRET_TEXT
  BASIC_AUTH
  CUSTOM_AUTH
  OAUTH2
  OIDC
  NONE
  """
  Reactor access for a piece's ctx.reactor; any piece may bind it.
  """
  REACTOR
}

type Connection_ConnectionState {
  name: String!
  """
  Fully-qualified connector id: '@acme/connector-imap#imap'.
  """
  connectorId: String!
  """
  Activepieces auth kind, so a piece's PieceAuth maps directly.
  """
  authType: Connection_ConnectionAuthType!
  """
  Non-secret configuration, validated against the connector's auth schema; a ReactorConnectionConfig for REACTOR.
  """
  config: Unknown!
  """
  Secret handles; values never appear in state, operations, or the run journal.
  """
  secretRefs: [Connection_SecretRef!]!
  status: Connection_ConnectionStatus!
  lastCheckedAt: DateTime
  lastError: String
  """
  Populated by the connector's own metadata call. Display only.
  """
  accountLabel: String
}

enum Connection_ConnectionStatus {
  UNCONFIGURED
  OK
  ERROR
  REVOKED
}

"""
Config of a REACTOR connection. It holds no secrets.
"""
type Connection_ReactorConnectionConfig {
  """
  Which reactor the connection reaches; 'local' is the only value.
  """
  endpoint: String!
  """
  'read' limits the connection to reads; absent allows what the step declares.
  """
  access: String
}

type Connection_SecretRef {
  id: OID!
  """
  Matches an auth property name in the connector's config schema.
  """
  name: String!
  """
  Opaque handle into the host secret provider. Not the secret.
  """
  ref: String!
}

