}

type DocumentDrive_DocumentDriveState {
  icon: String
  name: String!
  nodes: [DocumentDrive_Node!]!
}

type DocumentDrive_FileNode {
  documentType: String!
  id: String!
  kind: String!
  name: String!
  parentFolder: String
}

type DocumentDrive_FolderNode {
  id: String!
  kind: String!
  name: String!
