type PHOperationContext {
  signer: Signer
}

type Signer {
  user: SignerUser
  app: SignerApp
  signatures: [String!]!
}

type SignerUser {
  address: String!
  networkId: String!
  chainId: Int!
}

type SignerApp {
  name: String!
  key: String!
}

type Operation {
  id: String!
  type: String!
  index: Int!
  timestampUtcMs: DateTime!
  hash: String!
  skip: Int
  inputText: String
  error: String
  context: PHOperationContext
}

interface IDocument {
  id: String!
  name: String!
  documentType: String!
  revision: Int!
  createdAtUtcIso: DateTime!
  lastModifiedAtUtcIso: DateTime!
  operations(first: Int, skip: Int): [Operation!]!
  stateJSON: JSONObject
}

type DocumentDrive_FolderNode {
  id: String!
  name: String!
  kind: String!
  parentFolder: String
}

type DocumentDrive_FileNode {
  id: String!
  name: String!
  kind: String!
  documentType: String!
  parentFolder: String
}

union DocumentDrive_Node = DocumentDrive_FolderNode | DocumentDrive_FileNode

type DocumentDrive_DocumentDriveState {
  name: String!
  nodes: [DocumentDrive_Node!]!
  icon: String
}

type DocumentDrive_ListenerFilter {
  documentType: [String!]!
  documentId: [ID!]
  scope: [String!]
  branch: [String!]
}

enum DocumentDrive_TransmitterType {
  Internal
  SwitchboardPush
  PullResponder
  SecureConnect
  MatrixConnect
  RESTWebhook
}

type DocumentDrive_ListenerCallInfo {
  transmitterType: DocumentDrive_TransmitterType
  name: String
  data: String
}

type DocumentDrive_Listener {
  listenerId: ID!
  label: String
  block: Boolean!
  system: Boolean!
  filter: DocumentDrive_ListenerFilter!
  callInfo: DocumentDrive_ListenerCallInfo
}

enum DocumentDrive_TriggerType {
  PullResponder
}

type DocumentDrive_PullResponderTriggerData {
  listenerId: ID!
  url: String!
  interval: String!
}

union DocumentDrive_TriggerData = DocumentDrive_PullResponderTriggerData

type DocumentDrive_Trigger {
  id: ID!
  type: DocumentDrive_TriggerType!
  data: DocumentDrive_TriggerData
}

type DocumentDrive_DocumentDriveLocalState {
  sharingType: String
  listeners: [DocumentDrive_Listener!]!
  triggers: [DocumentDrive_Trigger!]!
  availableOffline: Boolean!
}

type DocumentDrive implements IDocument {
  id: String!
  name: String!
  documentType: String!
  operations(skip: Int, first: Int): [Operation!]!
  revision: Int!
  createdAtUtcIso: DateTime!
  lastModifiedAtUtcIso: DateTime!
  initialState: DocumentDrive_DocumentDriveState!
  state: DocumentDrive_DocumentDriveState!
  stateJSON: JSONObject
}

type DocumentModel_CodeExample {
  id: ID!
  value: String!
}

type DocumentModel_OperationError {
  id: ID!
  code: String
  name: String
  description: String
  template: String
}

type DocumentModel_Operation {
  id: ID!
  name: String
  schema: String
  description: String
  template: String
  errors: [DocumentModel_OperationError!]!
  examples: [DocumentModel_CodeExample!]!
  reducer: String
  scope: String
}

type DocumentModel_Module {
  id: ID!
  name: String!
  description: String
  operations: [DocumentModel_Operation!]!
}

type DocumentModel_State {
  schema: String!
  initialValue: String!
  examples: [DocumentModel_CodeExample!]!
}

type DocumentModel_ScopeState {
  global: DocumentModel_State!
  local: DocumentModel_State!
}

type DocumentModel_Author {
  name: String!
  website: String
}

type DocumentModel_DocumentSpecification {
  version: Int!
  state: DocumentModel_ScopeState!
  modules: [DocumentModel_Module!]!
  changeLog: [String!]!
}

type DocumentModel_DocumentModelGlobalState {
  name: String!
  id: String!
  extension: String!
  description: String!
  author: DocumentModel_Author!
  specifications: [DocumentModel_DocumentSpecification!]!
}

type DocumentModel implements IDocument {
  id: String!
  name: String!
  documentType: String!
  operations(skip: Int, first: Int): [Operation!]!
  revision: Int!
  createdAtUtcIso: DateTime!
  lastModifiedAtUtcIso: DateTime!
  stateJSON: JSONObject
}

type GqlDocument implements IDocument {
  id: String!
  name: String!
  documentType: String!
  revision: Int!
  createdAtUtcIso: DateTime!
  lastModifiedAtUtcIso: DateTime!
  operations(first: Int, skip: Int): [Operation!]!
  stateJSON: JSONObject
}

type DriveDocument implements IDocument {
  id: String!
  name: String!
  documentType: String!
  revision: Int!
  createdAtUtcIso: DateTime!
  lastModifiedAtUtcIso: DateTime!
  operations(first: Int, skip: Int): [Operation!]!
  stateJSON: JSONObject
}

type PrivacySubjectDocument {
  documentId: ID!
  role: String!
  firstOrdinal: Int!
  lastOrdinal: Int!
}

type PrivacyBoundSyncRemote {
  name: String!
  collectionId: String!
  channelType: String!
}

type PrivacyPeerManifestAppKey {
  remoteName: String!
  appKey: String!
  heardAtUtcMs: Float
}

type PrivacyPermissionRow {
  table: String!
  column: String!
  documentId: ID
  "JSON-encoded"
  detail: String
}

type PrivacyDisclosure {
  subjectHash: String!
  documents: [PrivacySubjectDocument!]!
  boundSyncRemotes: [PrivacyBoundSyncRemote!]!
  peerManifests: [PrivacyPeerManifestAppKey!]!
  permissions: [PrivacyPermissionRow!]!
  notCovered: [String!]!
}

type PrivacyErasurePlanItem {
  documentId: ID!
  expandedFrom: ID
  live: Boolean!
  operationCount: Int!
  groupReferencers: [ID!]!
}

type PrivacyErasurePlan {
  maxPurgeOperations: Int!
  items: [PrivacyErasurePlanItem!]!
}

type PrivacyErasureItem {
  documentId: ID!
  status: String!
  allowLarge: Boolean!
  markerOrdinal: Int
  lastError: String
  updatedAt: String!
}

type PrivacyErasureRequest {
  requestId: ID!
  subjectHash: String
  requestedBy: String!
  requestedAt: String!
  deadline: String!
  status: String!
  items: [PrivacyErasureItem!]!
}

type Query {
  disclose(identifier: String!): PrivacyDisclosure!
  erasurePlan(ids: [ID!]!): PrivacyErasurePlan!
  erasureRequest(requestId: ID!): PrivacyErasureRequest!
}

type Mutation {
  "deadline is an ISO 8601 timestamp"
  requestErasure(ids: [ID!]!, deadline: String, allowLarge: [ID!]): PrivacyErasureRequest!
}
