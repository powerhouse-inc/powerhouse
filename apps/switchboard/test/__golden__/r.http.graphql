type Mutation {
  addRelationship(branch: String, metadata: JSONObject, relationshipType: String!, sourceIdOrSlug: String, targetIdOrSlug: String): PHDocument!
  createDocument(document: JSONObject!, parentIdOrSlug: String): PHDocument!
  createEmptyDocument(documentType: String!, parentIdOrSlug: String): PHDocument!
  deleteDocument(idOrSlug: String, propagate: PropagationMode): Boolean!
  deleteDocuments(idsOrSlugs: [String!], propagate: PropagationMode): Boolean!

  """
  Applies actions to a document and waits for the result.
  
  Each action is coerced against `ActionInput`, so one missing a field the wire
  declares is refused before any work starts. The id in particular: it is hashed
  into the operation id and replay dedupes by it, so an action without one is
  stored under an operation id shared by every id-less operation on the same
  document, scope and branch.
  
  Named for `IReactorClient.execute`, which this is the wire form of. `branch`
  defaults to `main`.
  """
  execute(actions: [ActionInput!]!, branch: String, documentIdOrSlug: String): PHDocument!

  """
  Submits actions to a document and returns the job that will apply them.
  
  Coerced exactly as `execute` is, so a malformed action is refused here rather
  than surfacing later as a failed job. Returns the job rather than only its id,
  so a caller has the status and the creation time it would otherwise have to
  ask for; `result` is null until the job produces one.
  """
  executeAsync(actions: [ActionInput!]!, branch: String, documentIdOrSlug: String): JobInfo!

  """
  Applies multiple mutation jobs in dependency order and waits for all of them,
  the wire form of `IReactorClient.executeBatch`. Each job's actions are coerced
  against `ActionInput` exactly as `execute` is, so client-signed actions pass
  through unchanged, and `dependsOn` orders the jobs. It is synchronous: the jobs
  are applied and awaited before the result returns, so every returned `JobInfo`
  is a completed one rather than the pending receipt the in-process reactor hands
  back. A batch is ordering, not a transaction: each job commits on its own, and
  a failed job still releases the jobs that depend on it, so any job, before or
  after a failure, may have committed. A failed job is therefore returned as a
  FAILED entry with its `error` and `errorName`, beside the final state of every
  other job, rather than failing the mutation. The mutation itself fails only
  when no job state can be reported.
  
  A job carrying `CREATE_DOCUMENT` must be the batch's only job, with the create
  as its first action naming the job's document. Its other actions may only be
  an `UPGRADE_DOCUMENT` of the new document and `ADD_RELATIONSHIP`s targeting
  it. It is authorized like `createDocument`: write on every source of those
  relationships, or the right to create when there is none.
  """
  executeBatch(jobs: [ExecutionJobInput!]!): BatchExecutionResult!
  moveRelationship(branch: String, relationshipType: String!, sourceParentIdOrSlug: String, targetIdOrSlug: String, targetParentIdOrSlug: String): MoveRelationshipResult!
  mutateDocument(actions: [JSONObject!]!, documentIdentifier: String!, view: ViewFilterInput): PHDocument! @deprecated(reason: "Use execute. Actions here are untyped, so a malformed one is refused by a hand-written check rather than by the schema, and `view.scopes` is accepted but ignored.")
  mutateDocumentAsync(actions: [JSONObject!]!, documentIdentifier: String!, view: ViewFilterInput): String! @deprecated(reason: "Use executeAsync, which is typed and returns the job rather than only its id.")
  pushSyncEnvelopes(envelopes: [SyncEnvelopeInput!]!, peerManifestRevision: String): Boolean!
  removeRelationship(branch: String, relationshipType: String!, sourceIdOrSlug: String, targetIdOrSlug: String): PHDocument!
  renameDocument(branch: String, documentIdOrSlug: String, name: String!): PHDocument!
  setPreferredEditor(branch: String, documentIdOrSlug: String, preferredEditor: String): PHDocument!
  touchChannel(input: TouchChannelInput!): TouchChannelResult!
  updateRelationship(branch: String, metadata: JSONObject, relationshipType: String!, sourceIdOrSlug: String, targetIdOrSlug: String): PHDocument!
}

