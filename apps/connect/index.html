<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Connect is a hub for your most important documents and processes, translated into software. Easily capture data in a structured way with dedicated business process packages. Collaborate on shared documents with ease while using your preferred storage solution (decentralized, centralized, or local)."
    />
    <title>Powerhouse Connect</title>
    <link rel="icon" href="%BASE_URL%icon.ico" />
    <link href="/style.css" rel="stylesheet" />
    <script data-ph-theme-boot>
      (function () {
        try {
          var p = new URLSearchParams(location.search).get("theme");
          if (p === "dark" || p === "light")
            localStorage.setItem("ph:theme", p);
          var s = localStorage.getItem("ph:theme");
          var m = matchMedia("(prefers-color-scheme: dark)");
          var d = s === "dark" || ((!s || s === "system") && m.matches);
          document.documentElement.classList.toggle("dark", d);
          // Same as builder-tools' theme-boot: follow a late OS preference.
          if (!s || s === "system") {
            var f = function () {
              var t = localStorage.getItem("ph:theme");
              if (!t || t === "system")
                document.documentElement.classList.toggle("dark", m.matches);
            };
            m.addEventListener("change", f);
            requestAnimationFrame(f);
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
