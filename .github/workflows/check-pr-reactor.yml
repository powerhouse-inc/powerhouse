name: Check PR reactor

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "packages/reactor/**"
      - "packages/reactor-api/**"
      - "test/test-connect/**"
      - "test/test-client/**"
      - ".github/workflows/check-pr-reactor.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "packages/reactor/**"
      - "packages/reactor-api/**"
      - "test/test-connect/**"
      - "test/test-client/**"
      - ".github/workflows/check-pr-reactor.yml"
    types: [opened, synchronize]

env:
  NX_ISOLATE_PLUGINS: false

jobs:
  test-reactor:
    name: Test Reactor
    runs-on: ubuntu-24.04
    container: node:24

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reactor
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      REACTOR_TEST_PG_URL: postgres://postgres:postgres@postgres:5432/reactor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Setup bun global install
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: pnpm install-ci

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint
        working-directory: packages/reactor

      - name: Run tests
        run: >-
          pnpm test:reactor
          --reporter=default
          --reporter=json
          --outputFile.json=vitest-timings.json

      # This step's duration swings by ~50% run to run on identical code, while
      # install, build and lint stay flat — so it is the suite, not the runner.
      # Answering "which files" needs per-file timings from a fast run and a
      # slow one, and a slow run is only diagnosable if it was already being
      # recorded. Uploaded unconditionally for that reason.
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reactor-test-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/reactor/vitest-timings.json
          if-no-files-found: warn
          retention-days: 90

  integration-test:
    name: Sync Integration Tests
    needs: test-reactor
    runs-on: ubuntu-24.04
    container: node:24
    # The last green main run took 14m22s against the previous 15m budget:
    # two ~6m hub-spoke legs plus the load test left no headroom, and runner
    # variance tipped it into cancellation mid-leg.
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      REACTOR_TEST_PG_HOST: postgres
      REACTOR_TEST_PG_PORT: "5432"
      REACTOR_TEST_PG_USER: postgres
      REACTOR_TEST_PG_PASSWORD: postgres
      PH_REGISTRY_URL: https://registry.dev.vetra.io/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Setup bun global install
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install postgresql-client-17 from PGDG (matches dump format 1.15)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates gnupg
          install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${codename}-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list
          apt-get update
          apt-get install -y --no-install-recommends postgresql-client-17
          pg_restore --version

      - name: Install dependencies
        run: pnpm install-ci

      - name: Build
        run: pnpm build

      - name: Run integration tests
        run: pnpm test:integration

  duration-watch:
    name: CI duration watch
    # Warn-only trend guard: compares each job's duration against the median
    # of recent green main runs, so a slow creep is flagged the week it
    # starts instead of the day it walks into a timeout.
    needs: [test-reactor, integration-test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compare against baseline
        uses: ./.github/actions/duration-watch
        with:
          workflow-file: check-pr-reactor.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
