name: Check Commit (pnpm pipeline)

# Measurement, not a gate. Mirrors the `check` job of check-commit.yml but gets
# its dependencies and build from `pnpm pipeline`, which does the frozen install
# and the task graph in one command and restores cached task outputs. Runs
# alongside the real `check` on the same commit, so the two are comparable
# without cross-run runner variance. continue-on-error keeps it from blocking.

concurrency:
  group: check-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  check-pipeline:
    name: check (pnpm pipeline)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed files
        id: diff
        uses: ./.github/actions/changed-files

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Setup bun global install
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      # Unlike nx, whose metadata db is named after the machine's hardware UUID
      # and so is rejected on another runner, this cache is content-addressed
      # and portable. Verified by transplanting it into a clean tree.
      - name: Restore pnpm pipeline cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pnpm/pipeline
          key: pnpm-pipeline-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            pnpm-pipeline-v1-${{ runner.os }}-

      # Replaces both `pnpm install-ci` and `pnpm build`: pipeline does the
      # frozen install itself, then runs the build task graph. --full because
      # the later steps need every project's dist, and affected-selection only
      # restores outputs for tasks it actually runs.
      - name: Install and build via pipeline
        run: pnpm pipeline build --full

      - name: Install release tool dependencies
        run: bun install
        working-directory: releases

      - name: Check tsconfig references
        run: pnpm check-ts-references

      - name: Typecheck
        run: pnpm typecheck

      - name: Build storybook
        run: pnpm build:storybook

      - name: Re-link workspace bins now that dist files exist
        run: pnpm rebuild --recursive

      - name: Build packages that depend on generated binaries
        run: pnpm --filter=@powerhousedao/versioned-documents --no-bail run build

      - name: Run eslint
        if: ${{ steps.diff.outputs.files != '' }}
        run: NODE_OPTIONS=--max-old-space-size=8192 pnpm eslint --config eslint.config.js --quiet --no-error-on-unmatched-pattern ${{ steps.diff.outputs.files }}

      - name: Run circular imports check
        run: pnpm check-circular-imports
