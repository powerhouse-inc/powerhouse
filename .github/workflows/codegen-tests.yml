name: Codegen Tests

concurrency:
  group: codegen-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "apps/academy/**"
      - ".claude/**"
      - "LICENSE"
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "apps/academy/**"
      - ".claude/**"
      - "LICENSE"

permissions:
  contents: read

jobs:
  do-codegen-tests:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup bun global install
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      # Only test-codegen and the workspace packages it depends on.
      - name: Install and build
        run: bash .github/actions/setup/install-and-build.sh "test-codegen..."

      - name: Run tests
        run: pnpm test:codegen

  notify-discord:
    if: failure() && github.event_name != 'pull_request'
    needs: [do-codegen-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_FAILURES }}
          DISCORD_USER_MAPPING: ${{ secrets.DISCORD_USER_MAPPING }}
        run: |
          DISCORD_USER=$(echo "$DISCORD_USER_MAPPING" | jq -r --arg GH_USER "${{ github.actor }}" '.[$GH_USER] // ""')
          MENTION_STRING=""
          if [ -n "$DISCORD_USER" ]; then
            MENTION_STRING="<@${DISCORD_USER}> "
          fi

          curl -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK" -d '{
            "embeds": [{
              "title": "⚠️ Codegen tests failed",
              "description": "**Author:** '"${MENTION_STRING}"'\n**Commit:** [`${{ github.event.head_commit.message }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) \n**Failed job:** [`do-codegen-tests`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
              "color": 16711680
            }]
          }'
