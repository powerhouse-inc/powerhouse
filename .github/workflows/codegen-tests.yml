name: Codegen Tests

concurrency:
  group: codegen-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "apps/academy/**"
      - ".claude/**"
      - "LICENSE"
  # Also skips workspace packages outside test/codegen's dependency closure
  # (`pnpm list --filter "test-codegen..."`); main stays docs-only as the backstop.
  pull_request:
    # ci/** lets a change to this workflow be exercised by a pull request
    # stacked on its branch before it reaches main.
    branches: ["main", "ci/**"]
    types: [opened, reopened, synchronize]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "apps/academy/**"
      - ".claude/**"
      - "LICENSE"
      - "clis/ph-cmd/**"
      - "packages/analytics-engine/benchmarks/**"
      - "packages/analytics-engine/compat/**"
      - "packages/reactor-hypercore/**"
      - "packages/reactor/bench/**"
      - "packages/registry/**"
      - "packages/switchboard-gui/**"
      - "scripts/dark-mode/**"
      - "scripts/profiling/**"
      - "scripts/release/**"
      - "test/e2e-utils/**"
      - "test/lb-loadtest/**"
      - "test/package-e2e/**"
      - "test/recipes-e2e/**"
      - "test/switchboard/**"
      - "test/test-client/**"
      - "test/test-connect/**"
      - "test/test-consumer-project/**"
      - "test/test-fusion/**"
      - "test/test-sync-queue/**"
      - "test/versioned-documents/**"
      - "test/vetra-e2e/**"
      - "test/workflow-piece-e2e/**"
      - "tools/**"

permissions:
  contents: read

jobs:
  do-codegen-tests:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup bun global install
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install deps (frozen lockfile)
        run: pnpm install-ci

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test:codegen

  notify-discord:
    if: failure() && github.event_name != 'pull_request'
    needs: [do-codegen-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_FAILURES }}
          DISCORD_USER_MAPPING: ${{ secrets.DISCORD_USER_MAPPING }}
        run: |
          DISCORD_USER=$(echo "$DISCORD_USER_MAPPING" | jq -r --arg GH_USER "${{ github.actor }}" '.[$GH_USER] // ""')
          MENTION_STRING=""
          if [ -n "$DISCORD_USER" ]; then
            MENTION_STRING="<@${DISCORD_USER}> "
          fi

          curl -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK" -d '{
            "embeds": [{
              "title": "⚠️ Codegen tests failed",
              "description": "**Author:** '"${MENTION_STRING}"'\n**Commit:** [`${{ github.event.head_commit.message }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) \n**Failed job:** [`do-codegen-tests`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
              "color": 16711680
            }]
          }'
