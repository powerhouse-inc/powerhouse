name: Check Commit

concurrency:
  group: check-commit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main", "release/**"]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed files
        id: diff
        uses: ./.github/actions/changed-files

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Setup bun global install
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install deps (frozen lockfile)
        run: pnpm install-ci

      - name: Install release tool dependencies
        run: bun install
        working-directory: releases

      - name: Check tsconfig references
        run: pnpm check-ts-references

      - name: Restore Nx build cache
        uses: ./.github/actions/nx-cache

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Build storybook
        run: pnpm build:storybook

      - name: Re-link workspace bins now that dist files exist
        run: pnpm rebuild --recursive

      - name: Build packages that depend on generated binaries
        run: pnpm --filter=@powerhousedao/versioned-documents --no-bail run build

      - name: Run eslint
        if: ${{ steps.diff.outputs.files != '' }}
        run: NODE_OPTIONS=--max-old-space-size=8192 pnpm eslint --config eslint.config.js --quiet --no-error-on-unmatched-pattern ${{ steps.diff.outputs.files }}

      - name: Skip lint (no changed files)
        if: ${{ steps.diff.outputs.files == '' }}
        run: echo "No changed files; skipping linting."

      - name: Run circular imports check
        run: pnpm check-circular-imports

  # The whole suite, split three ways. Three is the useful maximum: switchboard
  # alone is 44s of the 137s total, so a fourth shard would sit idle.
  test:
    name: Test (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: General setup
        uses: ./.github/actions/setup

      # reactor-browser runs half its suite in a real chromium (vitest browser
      # mode). Installed in every shard so the split can be rebalanced freely.
      - name: Install playwright chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ./packages/reactor-browser

      # The engine's piece suites fetch Activepieces bundles from npm. Keyed on
      # the suites themselves: a run that changes none of them reuses the bundles.
      - name: Cache Activepieces bundles
        uses: actions/cache@v4
        with:
          path: packages/reactor-workflow/node_modules/.cache/ap-bundles
          key: ap-bundles-${{ hashFiles('packages/reactor-workflow/test/pieces/**/*.test.ts', 'packages/reactor-workflow/src/reactor/trigger-supervisor.test.ts') }}
          restore-keys: ap-bundles-

      - name: Run shard
        run: pnpm exec tsx scripts/test-shard.ts ${{ matrix.shard }} 3

  notify-discord:
    if: failure() && github.event_name != 'pull_request'
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_FAILURES }}
          DISCORD_USER_MAPPING: ${{ secrets.DISCORD_USER_MAPPING }}
        run: |
          DISCORD_USER=$(echo "$DISCORD_USER_MAPPING" | jq -r --arg GH_USER "${{ github.actor }}" '.[$GH_USER] // ""')
          MENTION_STRING=""
          if [ ! -z "$DISCORD_USER" ]; then
            MENTION_STRING="<@${DISCORD_USER}> "
          fi

          curl -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK" -d '{
            "embeds": [{
              "title": "⚠️ Commit Check Failed",
              "description": "**Author:** '"${MENTION_STRING}"'\n**Commit:** [`${{ github.event.head_commit.message }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) \n**Failed job:** [`check`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
              "color": 16711680
            }]
          }'
