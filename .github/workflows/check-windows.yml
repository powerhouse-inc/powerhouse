name: Check Windows

# Windows is not covered by any other workflow: every job in this repo runs on
# ubuntu, yet release-branch.yml ships a `ph-windows-x64.exe` built there. This
# job exists so Windows-only breakage (POSIX-only scripts, `path.join` used to
# build URL paths or module specifiers, permission bits that do not exist on
# NTFS) is caught rather than discovered by users.
#
# Deliberately narrower than Check Commit: install, build, and the test suites of
# the packages that actually touch the filesystem, spawn processes or build
# module specifiers (`test:ci:platform`). Storybook, eslint, the e2e suites and
# every platform-agnostic suite stay on ubuntu -- this is about platform
# portability, not duplicating the whole matrix. reactor-browser and
# design-system in particular are the two largest suites and contain no
# platform-sensitive code, so running them here bought nothing and cost a
# chromium download on the 2x-billed runner.

concurrency:
  group: check-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main", "release/**"]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  check-windows:
    runs-on: windows-latest
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Defender scans every one of the ~100k files pnpm links and the build
      # writes; a narrow exclusion, not -DisableRealtimeMonitoring.
      - name: Exclude the workspace from Defender real-time scanning
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:LOCALAPPDATA\pnpm" -ErrorAction Stop
            Write-Host "Defender exclusions added."
          } catch {
            Write-Host "::warning::Could not add Defender exclusions: $_"
          }

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      # bun is a hard prerequisite: the `postbuild` steps of ph-cli, ph-cmd and
      # registry all shell out to it, so `pnpm build` cannot finish without it.
      - name: Setup bun global install
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install deps (frozen lockfile)
        run: pnpm install-ci

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Re-link workspace bins now that dist files exist
        run: pnpm rebuild --recursive

      - name: Run platform-sensitive tests
        run: pnpm test:ci:platform

      - name: Smoke test the built CLI
        run: node clis/ph-cli/dist/cli.mjs --version
