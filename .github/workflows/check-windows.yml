name: Check Windows

# Windows is not covered by any other workflow: every job in this repo runs on
# ubuntu, yet release-branch.yml ships a `ph-windows-x64.exe` built there. This
# job exists so Windows-only breakage (POSIX-only scripts, `path.join` used to
# build URL paths or module specifiers, permission bits that do not exist on
# NTFS) is caught rather than discovered by users.
#
# Deliberately narrower than Check Commit: install, build, and the test suites of
# the packages that actually touch the filesystem, spawn processes or build
# module specifiers (`test:ci:platform`). Storybook, lint, the e2e suites and
# every platform-agnostic suite stay on ubuntu -- this is about platform
# portability, not duplicating the whole matrix. reactor-browser and
# design-system in particular are the two largest suites and contain no
# platform-sensitive code, so running them here bought nothing and cost a
# chromium download on the 2x-billed runner.

concurrency:
  group: check-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: ["main", "release/**"]
  pull_request:
    # ci/** lets a change to these workflows be exercised by a pull request
    # stacked on its branch before it reaches main.
    branches: ["main", "release/**", "ci/**"]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  # The platform suites split two ways: reactor-api and switchboard are about
  # half the Windows test time, and one runner's CPUs are the limit.
  check-windows:
    name: check-windows (shard ${{ matrix.shard }}/2)
    runs-on: windows-latest
    # A shard takes 7–10 min; a hung build otherwise holds the runner for 6 h.
    timeout-minutes: 25
    env:
      CI: true
      TEST_SHARD_SCRIPT: test:ci:platform
      TEST_SHARD_WEIGHTS: scripts/test-weights.windows.json
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      # pnpm's supply-chain check of the lockfile takes ~90s here; it skips it
      # when this verdict matches the lockfile and policy.
      - name: Cache pnpm lockfile verification
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pnpm-cache\lockfile-verified.jsonl
          key: pnpm-lockfile-verified-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
          restore-keys: pnpm-lockfile-verified-${{ runner.os }}-

      # bun is a hard prerequisite: the `postbuild` steps of ph-cli, ph-cmd and
      # registry all shell out to it, so `pnpm build` cannot finish without it.
      - name: Setup bun global install
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install deps (frozen lockfile)
        run: pnpm install-ci

      - name: Build
        run: pnpm build

      - name: Re-link workspace bins now that dist files exist
        run: pnpm rebuild --recursive

      - name: Run platform-sensitive tests
        run: node scripts/test-shard.ts ${{ matrix.shard }} 2

      - name: Smoke test the built CLI
        run: node clis/ph-cli/dist/cli.mjs --version
