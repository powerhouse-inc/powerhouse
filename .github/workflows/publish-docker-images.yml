name: Build and Publish Docker Images

# Both inputs are optional on both triggers. release-branch.yml passes the tag
# it just released and that release's npm tag. A bare manual dispatch still
# works: the tag is then the newest one of the branch's channel, and the
# channel is read from the tag.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: false
        default: ""
      channel:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: false
        default: ""
        description: "Release tag, e.g. v6.3.0-dev.8. Empty: newest tag of this branch's channel."
      channel:
        type: string
        required: false
        default: ""
        description: "npm tag of that release: dev, rc, staging, latest or next. Empty: read from the tag."

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  HARBOR_REGISTRY: cr.vetra.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: registry
            context: ./packages/registry
          - image: connect
            context: .
            dockerfile: docker/Dockerfile
            target: connect
            harbor_only: true
          - image: switchboard
            context: .
            dockerfile: docker/Dockerfile
            target: switchboard
            harbor_only: true
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
      channel: ${{ steps.get-tag.outputs.channel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Get tags
        run: git fetch --tags origin
      - name: Set tag and channel
        id: get-tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            # The caller names the release to build.
            TAG="$INPUT_TAG"
            if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::Tag $TAG does not exist"
              exit 1
            fi
          # No tag given (manual dispatch): pick the most recent tag for the
          # channel matching this branch. A picker over all tags would grab a
          # tag from a sibling channel whenever, say, a `release/staging/*`
          # cut happened after the most recent `-dev` tag, and then overwrite
          # Harbor's `staging` floating tag with main-branch code.
          elif [[ "$BRANCH" == "main" ]]; then
            TAG=$(git tag --sort=-creatordate --list '*-dev.*' | head -n 1)
          elif [[ "$BRANCH" == release/rc/* ]]; then
            TAG=$(git tag --sort=-creatordate --list '*-rc.*' | head -n 1)
          elif [[ "$BRANCH" == release/staging/* ]]; then
            TAG=$(git tag --sort=-creatordate --list '*-staging.*' | head -n 1)
          elif [[ "$BRANCH" == release/production/* ]]; then
            TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          else
            echo "::error::Unknown branch '$BRANCH' — refusing to guess a tag. Give the tag input."
            exit 1
          fi

          # The channel is the floating image tag and decides what the jobs
          # below update. Without the input it is read from the tag; a tag
          # that fits no channel gets no floating tag and updates nothing.
          CHANNEL="$INPUT_CHANNEL"
          if [[ -z "$CHANNEL" ]]; then
            if   [[ "$TAG" == *"-dev."* ]];     then CHANNEL=dev
            elif [[ "$TAG" == *"-rc."* ]];      then CHANNEL=rc
            elif [[ "$TAG" == *"-staging."* ]]; then CHANNEL=staging
            elif [[ "$TAG" == *"-next."* ]];    then CHANNEL=next
            elif [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then CHANNEL=latest
            fi
          fi
          case "$CHANNEL" in
            dev|rc|staging|next|latest|"") ;;
            *) echo "::error::channel must be dev, rc, staging, latest or next (got '$CHANNEL')"; exit 1 ;;
          esac

          echo "GITHUB_TAG=$TAG" >> "$GITHUB_ENV"
          echo "ADDITIONAL_TAG=$CHANNEL" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Validate tag
        run: |
          if [ -z "${{ env.GITHUB_TAG }}" ]; then
            echo "::error::No tags found — cannot build Docker image without a version tag"
            exit 1
          fi
          echo "Using tag: ${{ env.GITHUB_TAG }}"
          echo "Using channel: ${{ env.ADDITIONAL_TAG }}"
      - name: Set image paths
        run: |
          HARBOR_PROJECT="${GITHUB_REPOSITORY//\//-}"
          echo "HARBOR_PATH=${HARBOR_PROJECT}/${{ matrix.image }}" >> $GITHUB_ENV
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ matrix.harbor_only != true }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PATNAME }}

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          target: ${{ matrix.target || '' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ matrix.harbor_only != true && format('{0}/{1}/{2}:{3}', env.REGISTRY, github.repository, matrix.image, env.GITHUB_TAG) || '' }}
            ${{ format('{0}/{1}:{2}', env.HARBOR_REGISTRY, env.HARBOR_PATH, env.GITHUB_TAG) }}
            ${{ matrix.harbor_only != true && env.ADDITIONAL_TAG != '' && format('{0}/{1}/{2}:{3}', env.REGISTRY, github.repository, matrix.image, env.ADDITIONAL_TAG) || '' }}
            ${{ env.ADDITIONAL_TAG != '' && format('{0}/{1}:{2}', env.HARBOR_REGISTRY, env.HARBOR_PATH, env.ADDITIONAL_TAG) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TAG=${{ env.GITHUB_TAG }}
            GIT_SHA=${{ github.sha }}

  notify-auto-update:
    name: Notify Cloud Auto-Update
    needs: build
    if: ${{ needs.build.outputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify cloud switchboard
        env:
          TAG: ${{ needs.build.outputs.tag }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          WEBHOOK_URL: ${{ secrets.CLOUD_AUTO_UPDATE_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.CLOUD_AUTO_UPDATE_WEBHOOK_SECRET }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "No webhook URL configured, skipping"
            exit 0
          fi
          # The cloud has environments for these channels only; a next build
          # (or a tag that fits no channel) notifies nobody.
          case "$CHANNEL" in
            dev|rc|staging|latest) ;;
            *) echo "No auto-update channel for '$CHANNEL', skipping"; exit 0 ;;
          esac

          echo "Notifying auto-update: tag=$TAG, channel=$CHANNEL"
          curl -sf -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { notifyNewImageRelease(input: { tag: \\\"${TAG}\\\", channel: \\\"${CHANNEL}\\\", images: [\\\"switchboard\\\", \\\"connect\\\"], secret: \\\"${WEBHOOK_SECRET}\\\" }) { updatedEnvironments } }\"}" \
            || echo "Auto-update notification failed (non-fatal)"

  update-k8s-switchboard-connect:
    name: Update Switchboard + Connect Images in K8s Hosting
    needs: build
    if: ${{ needs.build.outputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Determine target environments
        id: env
        env:
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          if [[ "$CHANNEL" == "dev" ]]; then
            echo "targets=dev" >> $GITHUB_OUTPUT
          else
            echo "Skipping k8s update — switchboard+connect auto-bump is scoped to the dev channel only (channel: '$CHANNEL')"
          fi

      - name: Update switchboard + connect image tags in k8s-hosting
        if: ${{ steps.env.outputs.targets != '' }}
        env:
          TAG: ${{ needs.build.outputs.tag }}
          TARGETS: ${{ steps.env.outputs.targets }}
          K8S_REPO_PAT: ${{ secrets.K8S_REPO_PAT }}
        run: |
          git clone "https://x-access-token:${K8S_REPO_PAT}@github.com/powerhouse-inc/powerhouse-k8s-hosting.git"
          cd powerhouse-k8s-hosting

          git config user.name "Github Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for TARGET_ENV in $TARGETS; do
            VALUES_FILE="tenants/${TARGET_ENV}/powerhouse-values.yaml"
            # Update switchboard image tag (line after switchboard's repository line)
            sed -i '/repository: cr.vetra.io\/powerhouse-inc-powerhouse\/switchboard/{n;s/\(.*tag: \).*/\1'"${TAG}"'/}' "$VALUES_FILE"
            # Update connect image tag (line after connect's repository line)
            sed -i '/repository: cr.vetra.io\/powerhouse-inc-powerhouse\/connect/{n;s/\(.*tag: \).*/\1'"${TAG}"'/}' "$VALUES_FILE"
            git add "$VALUES_FILE"
          done

          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(${TARGETS// /,}): update switchboard + connect image tags to ${TAG}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done

  update-k8s-registry:
    name: Update Registry Image in K8s Hosting
    needs: build
    if: ${{ needs.build.outputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Determine target environments
        id: env
        env:
          TAG: ${{ needs.build.outputs.tag }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          if [[ "$CHANNEL" == "dev" ]]; then
            echo "targets=dev" >> $GITHUB_OUTPUT
          elif [[ "$CHANNEL" == "staging" ]]; then
            echo "targets=staging" >> $GITHUB_OUTPUT
          elif [[ "$CHANNEL" == "latest" ]]; then
            # Production release: roll out the prod registry (vetra tenant,
            # registry.vetra.io) to the image this release just pushed.
            echo "targets=vetra" >> $GITHUB_OUTPUT
          else
            echo "Skipping k8s update for tag $TAG (channel: '$CHANNEL')"
          fi

      - name: Update registry image tag in k8s-hosting
        if: ${{ steps.env.outputs.targets != '' }}
        env:
          TAG: ${{ needs.build.outputs.tag }}
          TARGETS: ${{ steps.env.outputs.targets }}
          K8S_REPO_PAT: ${{ secrets.K8S_REPO_PAT }}
        run: |
          git clone "https://x-access-token:${K8S_REPO_PAT}@github.com/powerhouse-inc/powerhouse-k8s-hosting.git"
          cd powerhouse-k8s-hosting

          git config user.name "Github Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for TARGET_ENV in $TARGETS; do
            VALUES_FILE="tenants/${TARGET_ENV}/powerhouse-values.yaml"
            # Update registry image tag (matches the line after registry's repository line)
            sed -i '/repository: cr.vetra.io\/.*\/registry/{n;s/\(.*tag: \).*/\1'"${TAG}"'/}' "$VALUES_FILE"
            git add "$VALUES_FILE"
          done

          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(registry): update registry image tag to ${TAG}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
