name: Setup
description: Set up the required environment for running actions in the Powerhouse monorepo.
inputs:
  filter:
    description: >-
      Whitespace-separated pnpm selectors (e.g. "@powerhousedao/reactor...").
      Installs and builds only the matched projects. Empty installs and builds everything.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org

    - name: Setup pnpm with cache
      uses: pnpm/action-setup@v4
      with:
        version: 12.5.1
        run_install: false

    - name: Setup bun global install
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.8

    - name: Install and build
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
      # Split into one argument per selector, without globbing.
      run: set -f; bash "$GITHUB_ACTION_PATH/install-and-build.sh" $FILTER
