name: Nx build cache
description: >
  Restores Nx's task cache so `pnpm build` replays unchanged projects instead of
  rebuilding all 37. Every job that builds restores the same cache in parallel,
  so nothing is serialized behind a shared build job -- a PR touching two
  packages rebuilds those two and replays the rest, in each job independently.

inputs:
  key-prefix:
    description: Cache key prefix. Bump to invalidate every entry at once.
    default: nx-v1

runs:
  using: composite
  steps:
    # The exact key never hits on restore (the sha is unique per commit); it is
    # what this run writes. restore-keys is what actually serves the hit, and
    # falls back to the newest cache on this branch, then on the base branch.
    - name: Restore Nx cache
      uses: actions/cache@v4
      with:
        path: .nx/cache
        key: ${{ inputs.key-prefix }}-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          ${{ inputs.key-prefix }}-${{ runner.os }}-
