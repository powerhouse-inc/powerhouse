type InventoryItemState {
  name: String
  sku: String
  quantity: Int!
  location: String
  history: [StockMovement!]!
}

type StockMovement {
  id: OID!
  kind: StockMovementKind!
  delta: Int!
  location: String
  reason: String
  at: DateTime!
}

enum StockMovementKind {
  ADD
  ADJUST
  MOVE
}

# stock

input SetItemDetailsInput {
  name: String
  sku: String
}

input AddStockInput {
  id: OID!
  amount: Int!
  at: DateTime!
}

input AdjustQuantityInput {
  id: OID!
  delta: Int!
  reason: String
  at: DateTime!
}

input MoveItemInput {
  id: OID!
  location: String!
  at: DateTime!
}
