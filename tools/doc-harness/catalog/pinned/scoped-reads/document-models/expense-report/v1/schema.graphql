type ExpenseReportState {
  expenses: [Expense!]!
}

type Expense {
  id: ID!
  memo: String!
  amountCents: Int!
  status: ExpenseStatus!
  approvedBy: String
}

enum ExpenseStatus {
  PENDING
  APPROVED
}

type ExpenseReportLocalState {
  reviewNotes: [ReviewNote!]!
}

type ReviewNote {
  expenseId: ID!
  note: String!
}

# expenses

input SubmitExpenseInput {
  id: ID!
  memo: String!
  amountCents: Int!
}

input ApproveExpenseInput {
  id: ID!
}

# review

input AddReviewNoteInput {
  expenseId: ID!
  note: String!
}