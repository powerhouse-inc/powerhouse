scalar JSONObject

scalar AttachmentRef

scalar Amount_Tokens

scalar EthereumAddress

scalar Amount_Percentage

scalar EmailAddress

scalar Date

scalar DateTime

scalar URL

scalar Amount_Money

scalar OLabel

