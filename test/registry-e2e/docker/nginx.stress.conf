# The e2e cache rules against the stress stack's two replicas. Access logs are
# off so Docker's log pipeline isn't what the load test measures.
worker_processes auto;
events {
  worker_connections 4096;
}
http {
  proxy_cache_path /cache/data levels=1:2 keys_zone=npm:200m
                   max_size=18g inactive=30d use_temp_path=off;

  proxy_cache_valid 200 301 302 30s;
  proxy_cache_valid 404 5s;

  proxy_cache_lock on;
  proxy_cache_lock_timeout 5s;

  proxy_cache_use_stale updating error timeout
                        http_500 http_502 http_503 http_504 http_429;
  proxy_cache_background_update on;
  proxy_cache_revalidate on;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_http_version 1.1;
  proxy_set_header Connection "";

  proxy_buffering on;
  proxy_buffers 32 64k;
  proxy_busy_buffers_size 256k;
  proxy_temp_file_write_size 256k;
  client_max_body_size 1024m;
  proxy_read_timeout 120s;
  proxy_connect_timeout 30s;
  proxy_send_timeout 60s;

  log_format cache '$remote_addr $request_method $request_uri '
                  'status=$status cache=$upstream_cache_status '
                  'upstream=$upstream_addr '
                  'rt=$request_time urt=$upstream_response_time '
                  'bytes=$body_bytes_sent';
  access_log off;
  error_log /dev/stderr warn;

  # Docker DNS, re-read so a recreated replica's new address is picked up.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream registry {
    zone registry 64k;
    server registry-1:4873 resolve max_fails=3 fail_timeout=10s;
    server registry-2:4873 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    set $bypass 0;

    location = /healthz {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    location / {
      proxy_pass http://registry;

      if ($request_method !~ ^(GET|HEAD)$) {
        set $bypass 1;
      }

      # The stress test's cache-miss traffic: straight through, never stored
      if ($arg__nocache) {
        set $bypass 1;
      }

      if ($request_uri ~* "^/-/(whoami|user|npm/v1/user|npm/v1/tokens|npm/v1/security|org|team|ping)(/|$|\?)") {
        set $bypass 1;
      }

      proxy_cache_bypass $bypass;
      proxy_no_cache $bypass;

      proxy_cache npm;
      proxy_cache_key "$scheme$proxy_host$request_uri";

      location ~* /-/[^/]+\.tgz$ {
        proxy_pass http://registry;
        proxy_cache npm;
        proxy_cache_key "$scheme$proxy_host$request_uri";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 5s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_use_stale updating error timeout
                              http_500 http_502 http_503 http_504 http_429;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Upstream $upstream_addr always;
      }

      add_header X-Cache-Status $upstream_cache_status always;
      add_header X-Upstream $upstream_addr always;
    }
  }
}
