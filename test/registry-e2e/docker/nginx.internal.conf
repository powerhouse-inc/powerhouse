# Stands in for the registry's k8s Service: both replicas, no cache.
worker_processes 1;
events {
  worker_connections 2048;
}
http {
  access_log off;
  resolver 127.0.0.11 valid=5s ipv6=off;
  client_max_body_size 1024m;
  upstream registry {
    zone registry 64k;
    server registry-1:4873 resolve;
    server registry-2:4873 resolve;
    keepalive 16;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://registry;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_read_timeout 120s;
    }
  }
}
